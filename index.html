<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sadra Hadian</title>

    <!-- Font Awesome CDN برای آیکون‌ها -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            font-family: sans-serif;
            background: #f5f5f5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            width: 90%;
            max-width: 380px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
        }

        .title {
            font-size: 24px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px;
            background: #e0f7fa;
            border-radius: 12px;
            margin-bottom: 12px;
            direction: ltr;
            font-size: 16px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .item:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .icon {
            font-size: 28px;
            width: 28px;
            text-align: center;
        }

        a {
            text-decoration: none;
            color: inherit;
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="title">Sadra Hadian</div>

        <!-- شماره تلفن -->
        <div class="item">
            <i class="fas fa-phone icon"></i>
            <span>09934422139</span>
        </div>

        <!-- تلگرام -->
        <div class="item">
            <i class="fab fa-telegram icon"></i>
            <span>@sadrahnsh</span>
        </div>

        <!-- اینستاگرام -->
        <a href="https://instagram.com/sadrahnsh" target="_blank">
            <div class="item">
                <i class="fab fa-instagram icon"></i>
                <span>@sadrahnsh</span>
            </div>
        </a>

    </div>

</body>
</html>
