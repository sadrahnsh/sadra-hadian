<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sadra Hadian</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">

    <!-- Font Awesome برای آیکون‌ها -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: #fff;
            padding: 35px 25px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 25px;
            color: #333;
        }

        .item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 18px;
            margin-bottom: 14px;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 500;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .item:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .icon {
            font-size: 28px;
            width: 28px;
            text-align: center;
        }

        /* رنگ آیکون‌ها مثل لوگو واقعی */
        .phone-icon { color: #25a18e; }        /* سبز ملایم برای تلفن */
        .telegram-icon { color: #0088cc; }     /* آبی تلگرام */
        .instagram-icon { color: #E1306C; }    /* صورتی/قرمز اینستاگرام */

        a {
            text-decoration: none;
            color: inherit;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="title">Sadra Hadian</div>

        <!-- شماره تلفن -->
        <div class="item">
            <i class="fas fa-phone icon phone-icon"></i>
            <span>09934422139</span>
        </div>

        <!-- تلگرام -->
        <div class="item">
            <i class="fab fa-telegram icon telegram-icon"></i>
            <span>@sadrahnsh</span>
        </div>

        <!-- اینستاگرام -->
        <a href="https://instagram.com/sadrahnsh" target="_blank">
            <div class="item">
                <i class="fab fa-instagram icon instagram-icon"></i>
                <span>@sadrahnsh</span>
            </div>
        </a>

    </div>

</body>
</html>
