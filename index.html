<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sadra Hadian</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f5f5f5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            width: 90%;
            max-width: 380px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
        }

        .title {
            font-size: 24px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: #f0f0f0;
            border-radius: 10px;
            margin-bottom: 12px;
            direction: ltr;
            font-size: 16px;
        }

        img.icon {
            width: 26px;
            height: 26px;
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="title">Sadra Hadian</div>

        <div class="item">
            <img class="icon" src="https://upload.wikimedia.org/wikipedia/commons/3/3b/Phone_font_awesome.svg">
            <span>09934422139</span>
        </div>

        <div class="item">
            <img class="icon" src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg">
            <span>@sadrahnsh</span>
        </div>

        <a href="https://instagram.com/sadrahnsh" target="_blank" style="text-decoration: none; color: inherit;">
            <div class="item">
                <img class="icon" src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png">
                <span>@sadrahnsh</span>
            </div>
        </a>

    </div>

</body>
</html>
