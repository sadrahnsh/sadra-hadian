<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact - SADRA</title>

    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Vazirmatn", sans-serif;
            background: #000;
            text-align: center;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 35px;
            padding: 20px;
        }

        .profile-box {
            position: relative;
            margin: 0 auto;
            width: 170px;
            height: 170px;
        }

        .profile-box img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ffd700;
            box-shadow:
                0 0 25px rgba(255, 215, 0, 0.6),
                0 0 40px rgba(255, 215, 0, 0.4);
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.7);
            margin: 0;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin: 0 auto;
            padding: 15px 22px;
            width: 260px;
            background: #111;
            border: 1px solid rgba(255, 215, 0, 0.5);
            color: #f6f6f6;
            text-decoration: none;
            font-size: 20px;
            border-radius: 12px;
            transition: 0.25s;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.2);
        }

        .btn:hover {
            transform: translateY(-4px);
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.35);
        }

        i {
            font-size: 26px;
            color: #ffd700;
        }

        @media (max-width: 400px) {
            .profile-box {
                width: 120px;
                height: 120px;
            }
            .btn {
                width: 200px;
                font-size: 18px;
                padding: 12px 18px;
            }
            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

    <div class="profile-box">
        <img src="https://i.imgur.com/xPQX6yO.jpg" alt="عکس پروفایل صدرا" />
    </div>

    <h1>SADRA</h1>

    <!-- Call -->
    <a class="btn" href="tel:09934422139">
        <i class="fa-solid fa-phone"></i>
        <span>تماس</span>
    </a>

    <!-- Instagram (App link) -->
    <a class="btn" href="instagram://user?username=sadrahnsh">
        <i class="fa-brands fa-instagram"></i>
        <span>Instagram</span>
    </a>

    <!-- Telegram (App link) -->
    <a class="btn" href="tg://resolve?domain=sadrahnsh">
        <i class="fa-brands fa-telegram"></i>
        <span>Telegram</span>
    </a>

</body>
</html>
